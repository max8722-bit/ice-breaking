<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071c3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ICE BREAKING — 기울여 얼음집을 완성하세요</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-phone" aria-label="아이스 브레이킹 게임">
        <header class="hud">
          <div class="brand">
            <span class="brand__flake">✦</span>
            <div>
              <h1>ICE<br />BREAKING</h1>
              <p>얼음을 깨고 · 집을 잇다</p>
            </div>
          </div>
          <div class="build-meter" aria-label="이글루 완성도">
            <div class="build-meter__label"><span>이글루</span><strong id="buildCount">0 / 3</strong></div>
            <div class="build-meter__track"><i id="buildFill"></i></div>
          </div>
        </header>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="gameCanvas" width="390" height="700" aria-label="게임 화면"></canvas>
          <div class="toast" id="toast" aria-live="polite">망치질 준비!</div>

          <div class="tilt-gauge" aria-hidden="true">
            <span>왼쪽</span>
            <div><i id="tiltDot"></i></div>
            <span>오른쪽</span>
          </div>

          <section class="start-card" id="startCard">
            <p class="start-card__eyebrow">POLAR WORKSHOP № 01</p>
            <div class="start-card__hero" aria-hidden="true">
              <span class="hero-hammer">⌕</span>
              <span class="hero-ice">◆</span>
            </div>
            <h2>기울이고,<br /><em>얼음집을 완성하세요!</em></h2>
            <p class="start-card__copy">절벽 위에서 깎은 얼음 조각을<br />펭귄과 모닥불을 피해 집까지 배달하세요.</p>
            <div class="how-to">
              <div><b>01</b><span>휴대폰을<br />좌우로 기울이기</span></div>
              <i>→</i>
              <div><b>02</b><span>얼음 조각<br />3개 안착하기</span></div>
            </div>
            <button class="primary-button" id="startButton" type="button">
              <span>게임 시작</span><small>기울기 센서 켜기</small>
            </button>
            <p class="fallback-note">PC에서는 ← → 키 또는 화면 드래그</p>
          </section>

          <section class="result-card" id="resultCard" hidden>
            <p class="result-card__eyebrow" id="resultEyebrow">MISSION COMPLETE</p>
            <div class="result-card__igloo" id="resultIcon" aria-hidden="true">⌂</div>
            <h2 id="resultTitle">따뜻한 이글루 완성!</h2>
            <p id="resultCopy">세 개의 얼음 조각이 꼭 맞았어요.</p>
            <div class="result-card__score"><span>최종 점수</span><strong id="finalScore">0000</strong></div>
            <button class="primary-button" id="retryButton" type="button"><span>다시 만들기</span><small>새 얼음집 시작</small></button>
          </section>
        </div>

        <footer class="statusbar">
          <div class="integrity"><span>얼음 내구도</span><div><i id="integrityFill"></i></div><strong id="integrityValue">100%</strong></div>
          <button id="pauseButton" type="button" aria-label="일시정지">Ⅱ</button>
        </footer>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
